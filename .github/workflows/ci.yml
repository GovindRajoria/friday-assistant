name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # requirements.txt is deliberately not installed. It pulls ultralytics,
      # torch, faster-whisper, pyttsx3 and pynput — gigabytes of wheels, half of
      # which need audio and camera devices a runner does not have. Nothing
      # below needs them, and installing them would buy a slower job that still
      # could not exercise the runtime.
      # langgraph and pytest are the exception: the reasoning graph is pure
      # Python over those two, and the tests mock the model client, so this
      # stays a seconds-long job on a runner with no GPU, camera or model.
      # fastapi/uvicorn/starlette/httpx are the Phase 2 addition, pinned for
      # the same reason ruff is: an unpinned starlette that drops httpx
      # support (it has, historically) would silently break this job on a
      # change unrelated to anything in this repo.
      - name: Install
        run: pip install ruff==0.16.0 pytest==9.1.1 langgraph==1.2.10 fastapi==0.141.1 uvicorn==0.52.1 starlette==1.3.1 httpx==0.28.1

      # Pinned version: an unpinned linter is a gate that can fail on a release
      # unrelated to any change here.
      - name: Lint
        run: ruff check FRIDAY_CORE

      - name: Compile
        working-directory: FRIDAY_CORE
        run: python -m compileall -q core skills benchmarks tools

      # The real gate. core/main.py keys the skill registry by manifest["name"],
      # so two skills sharing a name silently overwrite each other with no error
      # anywhere. This asserts the names are unique and every manifest is
      # well-formed, reading them with ast so no skill has to be importable.
      - name: Skill manifests
        working-directory: FRIDAY_CORE
        run: python tools/check_manifests.py

      # Graph routing and the anomaly guard, both exercised against fakes. This
      # is the first thing in CI that tests behaviour rather than shape: the
      # step bound, the tool dispatch, and the mute rule all run here without a
      # model, a microphone or a camera.
      - name: Tests
        working-directory: FRIDAY_CORE
        run: python -m pytest tests -q
