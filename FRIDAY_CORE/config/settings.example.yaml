# Copy this file to config/settings.yaml and edit it.
#
# config/settings.yaml is git-ignored: it holds the operator's personal
# details and machine-specific hardware indices, neither of which belong in
# version control. Anything omitted here falls back to core/config.py DEFAULTS.

assistant:
  name: FRIDAY
  wake_word: friday
  # How the assistant addresses you in conversation.
  address_user_as: Sir

user:
  # Injected into the LLM system prompt so replies are grounded in who is
  # speaking. Leave as-is for a generic install.
  name: the operator
  location: ""
  interests: ""

llm:
  # Any model tag available to your local Ollama instance.
  model: llama3.1
  # Where the graph's chat calls go. Point this at a Pi 5 or a second Intel
  # box to offload inference; every call in the project goes through
  # core/llm_client.py, so this is the only place that has to change.
  host: http://127.0.0.1:11434
  # Hard ceiling on graph steps, enforced by core/graph.py on the whole chain
  # (not just malformed-output resamples, as the old brain.py bounded).
  max_react_steps: 12
  history_length: 10
  # Low temperature because routing wants determinism, not flair.
  temperature: 0.1

vlm:
  # No VLM is installed yet (Phase 4). Left here so the config shape exists
  # before anything reads it.
  enabled: false
  backend: ollama  # "ollama" | "openvino"
  model: moondream
  # May differ from llm.host if the VLM ends up on different hardware.
  host: http://127.0.0.1:11434

screen:
  # Continuous screen awareness (Phase 4).
  enabled: false
  # Measured on this machine: describe pass median 0.19s at 1280px, screen
  # grab alone 28ms — cheap enough to poll fairly often. The change gate
  # below means an idle desktop still only pays the grab+hash between real
  # changes. The 4.86s worst case seen while benchmarking only happened
  # when llama3.1 was busy at the same time, which vision/watcher.py avoids
  # by skipping a cycle outright while a turn is in flight, rather than by
  # widening this interval.
  interval_seconds: 5
  # Perceptual-hash hamming distance; how different two frames must be before
  # a describe pass is worth paying for.
  change_threshold: 6
  monitor: 1
  # 1280px wide. Measured the same speed as 768px and did not hallucinate;
  # 768px did ("xtop/xcode is the name of the program running"). Do not
  # shrink this without re-verifying output quality.
  max_width: 1280

server:
  # FastAPI + WebSocket layer (Phase 2). Bind 127.0.0.1 only.
  host: 127.0.0.1
  port: 8756
  # Set false while iterating on the server so it does not talk out loud on
  # every restart. The live settings.yaml is what most people edit for this,
  # not this example file.
  speak: true

audio:
  # null = let speech_recognition choose the system default microphone.
  # Set an integer to pin a specific device; enumerate them with:
  #   python -c "import speech_recognition as sr; print(sr.Microphone.list_microphone_names())"
  input_device_index: null
  # Seconds of silence before an utterance is treated as finished.
  pause_threshold: 2.0
  phrase_time_limit: 10
  speech_rate: 175

vision:
  # OpenCV camera index. 0 is the default built-in webcam.
  camera_index: 0
  # Directory holding the exported OpenVINO IR model, relative to the
  # project root. Regenerate it with: python benchmarks/openvino_yolo11_opt.py
  model_dir: yolo11n_openvino_model
  confidence: 0.5

filesystem:
  # skills/os_control/manage_files.py (Phase 6) refuses to touch anything
  # outside these directories — resolved with Path.resolve() and checked
  # against each root's ancestry, not string-matched, so ".." and a symlink
  # pointing outside a root are refused rather than followed. Widen this
  # deliberately, one directory at a time; do not point it at a drive root.
  allowed_roots:
    - ~/FridayWorkspace
